model: "InSEEDS"

# Settings for LPJmL specifically for coupling (pycoupler)
#   (not covered by LPJmL's direct config)
lpjml_settings:
    # Convert country codes to readable names (uses ISO country codes)
    country_code_to_name: true

# Parallelization settings for pycopanlpjml
parallelization:
    # Maximum number of workers to use (0 = auto-detect from SLURM_CPUS_ON_NODE or CPU count)
    max_workers: 0
    
    # Enable debug output for parallelization
    debug: false
    
    # Parallelization mode ('auto', 'dask', 'mpi', 'serial')
    # 'auto' = auto-detect (tries Dask first, then MPI, then serial)
    # 'dask' = use Dask distributed (for HPC clusters)
    # 'mpi' = reuse LPJmL's MPI processes (recommended if LPJmL uses MPI)
    # 'serial' = force serial execution
    mode: 'dask' # 'auto'

# Profiling settings for pycopanlpjml
profiling:
    # Enable PyInstrument profiling for the driver (main) process
    # Generates HTML profile at: {output_dir}/profiling/profiling_main_{timestamp}.html
    driver: false

    # Enable worker-side profiling (Dask performance report + PyInstrument plugin)
    # Generates:
    # - Dask performance report: {output_dir}/profiling/dask_workers_{timestamp}.html
    # - Per-worker profiles: {output_dir}/profiling/workers/worker_{name}_{timestamp}.html
    workers: false

# Output collection settings for pycopanlpjml
# All settings from pycopanlpjml/config.yaml are explicitly listed here
output:
    # Output formats to write (after simulation completes)
    # If empty list [], no outputs will be written
    # Options: "netcdf", "parquet", "csv"
    # - NetCDF: Recommended for scientific analysis (fastest, CF-compliant)
    # - Parquet: Good for data analysis (columnar, compressed)
    # - CSV: Human-readable, good for small runs (slowest)
    format: ["netcdf", "csv"]  # or ["csv"], ["parquet"], ["netcdf"], []

    # Variables to be written to output files
    # This defines which entity-level variables should be collected and written
    # Format: {entity_type}: [list of variable names]
    # Variables must be defined in the entity's output_variables class attribute
    # Entity types: world, country, cell, farmer (or individual)
    # Entity type names are derived from class names (lowercased):
    # - World -> "world"
    # - Country -> "country"
    # - Cell -> "cell"
    # - Farmer -> "farmer" (also accepts "individual" as alias)
    # Farmer-level variables (Farmer class uses 'farmer' as entity type)
    # Use dotted paths for nested objects (e.g., behaviour.tpb)
    farmer:
        - "aft_id"
        - "tillage"
        - "cover_crop"
        - "residue_on_field"
        - "behaviour.practice_bundle"   # Current bundle ID (0-7)
        - "behaviour.proposed_bundle"   # Bundle being evaluated (-1 if none)
        - "behaviour.tpb"               # TPB value FOR the proposed_bundle
        - "behaviour.attitude"          # Attitude FOR the proposed_bundle
        - "behaviour.social_norm"       # Social norm FOR the proposed_bundle
        - "behaviour.pbc"               # PBC FOR the proposed_bundle
        - "behaviour.transition_blocker"    # Primary reason for blocked transition (0-12), label in 'label' column
        - "behaviour.transition_driver"     # Primary reason for successful transition (0-9), label in 'label' column
        - "capital"                     # Farm capital stock (USD, scaled by farm size)
        - "farm_size"                   # Farm size in hectares
        - "soilc"
        - "cropyield"
        - "root_moisture"
        - "litter_cover"

# Define which farmer variables map with coupled LPJmL input variables
coupling_map:
    tillage: ["with_tillage"]
    cover_crop: ["cover_crop"]
    residue_on_field: ["residue_on_field"]

# Practice dimensions for multi-practice farmer decisions
practice_dimensions:
    tillage: { n_options: 2 }  # 0=no-till (CA), 1=conventional tillage
    cover_crop:
        n_options: 3  # 0=none, 1=non-legumes, 2=legumes
        leaching_high: 5    # mgN/l threshold for non-legume selection
        fertilizer_high: 5  # gN/m2/yr threshold for non-legume selection
    residue:
        type: flexible
        # FAO CA threshold: 30% soil cover from crop residues
        # Below this, farmer increases retention; at/above, maintains current level
        ca_cover_threshold: 0.3

# Exploration constraints for random bundle exploration
# Prevents farmers from repeatedly trying unreasonable or failed combinations
exploration:
    # Minimum residue opportunity cost ($/ha) to consider notill_cover reasonable
    # Below this threshold, no-till + cover crops without residue is considered
    # wasteful since residue is cheap to keep. Above it, cover crops become a
    # rational alternative for soil coverage when residue is valuable elsewhere.
    residue_cost_threshold: 30.0
    # Number of failures (fallbacks) before excluding bundle from exploration
    # Farmers learn from their mistakes and avoid bundles that have failed twice
    max_failures: 2

# Residue economics using Smerald et al. (2023) MADRaT data
# "A global dataset for the production and usage of cereal residues"
# Data: production = recycled + removed + burnt
#   - burnt: burned (no economic value)
#   - removed: animal feed + other purposes (has opportunity cost)
#   - recycled: bedding that returns to field with manure
residue_economics:
    # Opportunity cost by use type ($/ha/yr)
    # These are weighted by spatial fractions from MADRaT data
    use_costs:
        burnt: 0.0            # Burned - no economic value
        removed: 80.0         # Animal feed + other purposes (has value)
        recycled: 0.0         # Bedding returns to field via manure
        other: 40.0           # Fallback for unknown uses
    # Default use type when spatial data unavailable
    default_removal_use: "other"
    # Reference year to use from MADRaT data (1965-2015 available)
    reference_year: 2015

control_run: False
pioneer_share: 0.25

# Farm economics (USD per hectare)
# Note: Values are per hectare to match LPJmL spatial resolution
# Average farm sizes vary: USA ~180 ha, EU median ~5 ha (Our World in Data, 2020)
# Profit calculation uses FAO producer prices (fao_pft_prices) - see prepare_fao_producer_prices.py
farm_economics:
    initial_capital: 1000.0     # $1000/ha starting capital (dummy)
    min_capital: 100.0          # $100/ha - below this, practices are deselected
    max_capital: 5000.0         # $5000/ha ceiling
    maintenance_cost: 200.0     # $200/ha/yr base farm maintenance (dummy)
    # Survival buffer: years of depreciation farmer can sustain before crisis
    # Based on USDA farm financial indicators (Katchova & Dinterman 2018)
    n_survival_years: 1
    # Savings rate: fraction of net profit reinvested into farm capital
    # Literature: 10-30% range (Lowder et al. 2016; FAO 2017)
    savings_rate: 0.15

# Practice costs (USD per hectare)
# Sources cited after values; to be refined with regional FAO/FAOSTAT data
# Note: When capital is low, practices are deselected in order of direct cost
#       (highest first): cover_crop > residue > tillage
practice_costs:
    tillage:
        # No-till planter custom rate ~$67/ha (farmdoc Illinois, 2023)
        transition: 70.0   # $/ha - no-till planter/drill investment amortized
        # Fuel savings: ~$42-59/ha (USDA, 2022; No-Till Farmer, 2022)
        direct: -50.0      # $/ha/yr - fuel SAVINGS with no-till (deselected last)
    cover_crop:
        # Seeder attachment minimal, included in planting
        transition: 25.0   # $/ha - seeder modification
        # Seed + seeding + termination: $37-93/ha median (SARE, 2023)
        direct: 75.0       # $/ha/yr - highest cost (deselected first)
    residue_on_field:
        # Minimal equipment change for retention vs removal
        transition: 10.0   # $/ha - equipment adjustment
        # Foregone straw sale value ~$50-60/ha (Manitoba Agriculture, 2023)
        direct: 50.0       # $/ha/yr - opportunity cost (deselected second)

# TPB decision thresholds (non-AFT-specific)
# Behavioral differences between AFTs come from weights and PBC parameters
tpb_thresholds:
    transition_threshold: 0.5   # TPB threshold to adopt new practice
    revert_threshold: 0.6   # Higher threshold to revert (hysteresis to avoid flip-flopping)
    # Evaluation interval: farmers don't reconsider practices every year
    # After transitioning, they commit to observing results for this many years (mean)
    # Actual interval is randomized: normal(evaluation_interval, evaluation_interval/2)
    # Literature: Farm planning cycles typically 5-10 years (Pannell et al. 2006)
    evaluation_interval: 5  # Mean years between practice re-evaluations

# Analogous to LPJmL pftpar, define the AFT parameters for the two different
#   farmer types
aftpar:
    # AFT for conservative/traditional values following farmer tending to stay
    #   with conventional agriculture
    traditionalist:
        pbc_base: 0.75  # base perceived behavioral control
        weight_attitude: 0.6
        weight_yield: 0.8
        weight_soil: 0.4
        weight_moisture: 0.3  # drought resilience weight
        weight_norm: 0.4
        weight_social_learning: 0.4
        weight_own_land: 0.6
        # Learning inertia / hysteresis parameters
        min_observation_years: 3    # Minimum years before considering transition
        # Risk aversion (Chavas & Holt 1996): 0=neutral, 1=very averse
        risk_aversion: 0.2          # Traditionalists are more risk-averse (but must allow PBC > 0.5)
        # Similarity weights for social learning
        weight_bundle_similarity: 0.6   # Weight for practice bundle similarity
        weight_crop_similarity: 0.4     # Weight for crop portfolio similarity
        # Conformity pressure (Cialdini et al. 1990)
        conformity_bonus: 0.2       # Social norm boost for majority bundle
        conformity_penalty: 0.1     # Social norm penalty for minority bundle
        # Time parameters (unified, AFT-specific)
        confidence_years: 10        # Years to reach full confidence (linear ramp)
        memory_decay_years: 30      # When old memories are forgotten
        fallback_years: 10          # Consecutive decline years to trigger revert
        # Exploration parameters (Rogers 2003)
        exploration_base_prob: 0.01 # Base probability of random exploration
        poor_performance_threshold: 0.3  # Score below which exploration doubles
        poor_performance_multiplier: 2.0 # Multiplier for poor performers
        max_exploration_prob: 0.15  # Cap on exploration probability

    # AFT for pioneer farmer who more likely tends to transition to new (promising)
    #   regenerative agriculture practices
    pioneer:
        pbc_base: 0.95  # base perceived behavioral control
        weight_attitude: 0.8
        weight_yield: 0.4
        weight_soil: 0.8
        weight_moisture: 0.5  # pioneers care more about resilience
        weight_norm: 0.2
        weight_social_learning: 0.6
        weight_own_land: 0.4
        # Learning inertia / hysteresis parameters
        min_observation_years: 2    # Pioneers need less observation time
        # Risk aversion (Chavas & Holt 1996): 0=neutral, 1=very averse
        risk_aversion: 0.1          # Pioneers are less risk-averse
        # Similarity weights for social learning
        weight_bundle_similarity: 0.5   # Weight for practice bundle similarity
        weight_crop_similarity: 0.5     # Weight for crop portfolio similarity
        # Conformity pressure (Cialdini et al. 1990)
        conformity_bonus: 0.15      # Pioneers less influenced by conformity
        conformity_penalty: 0.05    # Pioneers less penalized for deviation
        # Time parameters (unified, AFT-specific)
        confidence_years: 8         # Pioneers trust observations sooner
        memory_decay_years: 25      # Pioneers forget old experiences faster
        fallback_years: 8           # Pioneers revert sooner if things go badly
        # Exploration parameters (Rogers 2003)
        exploration_base_prob: 0.05 # Pioneers explore more
        poor_performance_threshold: 0.3  # Score below which exploration doubles
        poor_performance_multiplier: 2.0 # Multiplier for poor performers
        max_exploration_prob: 0.20  # Higher cap for pioneers