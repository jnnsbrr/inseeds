model: "InSEEDS"

# Control run settings
control_run: False
# Enable PyInstrument profiling for the driver (main) process
# Generates HTML profile at: {output_dir}/profiling_{timestamp}.html
profiling: false

# Output collection settings for pycopanlpjml
# All settings from pycopanlpjml/config.yaml are explicitly listed here
output:
    # Output formats to write (after simulation completes)
    # If empty list [], no outputs will be written
    # Options: "netcdf", "parquet", "csv"
    # - NetCDF: Recommended for scientific analysis (fastest, CF-compliant)
    # - Parquet: Good for data analysis (columnar, compressed)
    # - CSV: Human-readable, good for small runs (slowest)
    format: ["netcdf", "csv"]  # or ["csv"], ["parquet"], ["netcdf"], []

    # Variables to be written to output files
    # This defines which entity-level variables should be collected and written
    # Format: {entity_type}: [list of variable names]
    # Variables must be defined in the entity's output_variables class attribute
    # Entity types: world, country, cell, farmer (or individual)
    # Entity type names are derived from class names (lowercased):
    # - World -> "world"
    # - Country -> "country"
    # - Cell -> "cell"
    # - Farmer -> "farmer" (also accepts "individual" as alias)
    # Country-level variables (static, written once)
    country:
        - "agroecological_cluster"  # Cluster ID based on climate similarity

    # Farmer-level variables (Farmer class uses 'farmer' as entity type)
    # Use dotted paths for nested objects (e.g., behaviour.tpb)
    farmer:
        - "aft_id"
        - "tillage"
        - "cover_crop"                     # 0=none, 1=catch crop, 2=legume
        - "residue_on_field"               # Fraction left (0-1), what LPJmL is told
        - "behaviour.residue_committed"    # The binary undertaking behind that fraction
        - "behaviour.practice_bundle_id"   # Current bundle ID (0-7), settable for Dask sync
        - "behaviour.proposed_bundle_id"   # Bundle being evaluated (-1 if none)
        - "behaviour.tpb"               # TPB value FOR the proposed_bundle_id
        - "behaviour.attitude"          # Attitude FOR the proposed_bundle_id
        - "behaviour.social_norm"       # Social norm FOR the proposed_bundle_id
        - "behaviour.pbc"               # PBC FOR the proposed_bundle_id
        - "behaviour.transition_blocker"    # Primary reason for blocked transition (0-12), label in 'label' column
        - "behaviour.transition_driver"     # Primary reason for successful transition (0-9), label in 'label' column
        - "baseline_revenue"            # Historic average revenue frozen at start ($)
        - "current_revenue"             # This year's harvest valued at prices ($)
        - "delta_revenue"               # = current_revenue - baseline_revenue ($)
        - "delta_costs"                 # Cost change from baseline bundle ($)
        - "carbon_payment"              # Payment for soil C sequestration ($)
        - "practice_subsidy"            # Payment for holding CA practices ($)
        - "nitrogen_charge"             # Charge on N leaching ($)
        - "raw_profit"                  # = delta_revenue - delta_costs + transfers ($)
        # Close the year's capital balance:
        #   ΔK = raw_profit - transition_cost + residue_sale_income
        - "transition_cost"             # One-off cost of a practice change ($)
        - "residue_sale_income"         # Straw sold on a forced deselection ($)
        # The two straw valuations delta_costs is a difference between
        - "residue_opportunity_cost"    # This year's straw at current revenue ($)
        - "baseline_residue_cost"       # Straw frozen on baseline revenue ($)
        - "leaching"                    # gN/m2/yr, the tracked flux
        - "leaching_concentration"      # mgN/l, reported only
        - "taxable_leaching"            # gN/m2/yr, the part above the allowance
        - "capital"                     # Farm capital stock (USD, scaled by farm size)
        - "farm_size"                   # Farm size in hectares
        - "soilc"
        - "cropyield"
        - "root_moisture"
        - "litter_cover"

# Define which farmer variables map with coupled LPJmL input variables
coupling_map:
    tillage: ["with_tillage"]
    cover_crop: ["cover_crop"]
    residue_on_field: ["residue_on_field"]

# Practice dimensions for multi-practice farmer decisions
practice_dimensions:
    cover_crop:
        n_options: 3  # 0=none, 1=non-legumes, 2=legumes
    residue:
        # FAO CA threshold: 30% soil cover from crop residues
        # Below this, farmer increases retention; at/above, maintains current level
        ca_cover_threshold: 0.3
        # How the residue component of the bundle is determined:
        # - false: by farmer decision only. What the farmer chooses is what
        #   LPJmL sees, and residue certification is left to post-processing,
        #   which can combine the reported bundle with the reported litter cover.
        # - true: by realised litter cover, following the FAO definition. A farm
        #   counts as retaining residue when the median of its recent cover
        #   reaches ca_cover_threshold, and stops counting when it falls below.
        #   The label is then a measurement of the field rather than a statement
        #   of intent, and costs stay with intent: a farm that reaches the
        #   threshold without choosing to keeps selling straw at the baseline
        #   rate, so it neither pays the opportunity cost nor draws the subsidy,
        #   while a farm that has to leave its residue to get there pays both.
        #
        #   The median over min_observation_years, read on the re-evaluation
        #   cadence rather than annually. Cover moves with the harvest, and a
        #   label read off one season would follow the weather - each flip
        #   redates the label and re-keys the slot the performance memory
        #   records under, so rainfall alone could stop a farm ever building up
        #   experience of anything.
        residue_status_by_cover: true

# Exploration constraints for random bundle exploration
# Prevents farmers from repeatedly trying unreasonable or failed combinations
exploration:
    # Number of failures (fallbacks) before excluding bundle from exploration
    # Farmers learn from their mistakes and avoid bundles that have failed twice
    max_failures: 2

# Residue economics using Smerald et al. (2023) MADRaT data
# "A global dataset for the production and usage of cereal residues"
# Data: production = recycled + removed + burnt
#   - burnt: burned (no economic value)
#   - removed: animal feed + other purposes (has opportunity cost)
#   - recycled: bedding returns to field with manure (no net cost)
#
# OPPORTUNITY COST AS PERCENTAGE OF CROP VALUE:
# ---------------------------------------------
# Singh & Schiere (1995, Ch. 1.1, Box 1) found: "the value of the straw yield
# can represent between 10-15% or higher of the total crop value"
#
# We implement this dynamically: residue_cost = crop_revenue × fraction
# This makes costs spatially and temporally variable (higher yields → higher cost)
#
# Cross-validation with market prices:
#   - Germany: €57-61/t (Karras et al. 2024) → 4 t/ha × €60/t = €240/ha
#   - India: $30-35/t (Duncan et al. 2020) → 4 t/ha × $33/t = $132/ha
#   - 12.5% of $600/ha crop value = $75/ha (reasonable global average)
#
# References:
#   - Singh, K. & Schiere, J.B. (eds.) (1995). Handbook for Straw Feeding
#     Systems. ICAR, New Delhi / Wageningen Agricultural University.
#     https://edepot.wur.nl/333326
#   - Karras, T., Noack, V. & Thrän, D. (2024). The Costs of Straw in Germany.
#     Waste and Biomass Valorization 15: 5369-5385.
#   - Duncan, A.J., Samaddar, A. & Blümmel, M. (2020). Rice and wheat straw
#     fodder trading in India. Field Crops Research 246: 107680.
#
residue_economics:
    # Opportunity cost as fraction of crop revenue (Singh & Schiere 1995: 10-15%)
    # Weighted by spatial fractions from MADRaT data (Smerald et al. 2023)
    use_cost_fractions:
        burnt: 0.0            # Burned - no economic value
        removed: 0.125        # 12.5% of crop value (midpoint of 10-15%)
        recycled: 0.0         # Returns to field via manure - no cost

# Agroecological country clustering for tele-coupled social learning
# Countries with similar agroecological conditions share social learning signals
agroecological_clustering:
    # Number of clusters. null = auto-determine via elbow method
    n_clusters: null
    # Range to search for optimal k when n_clusters is null
    k_range: [5, 15]

# Farm economics (USD per hectare)
# Note: Values are per hectare to match LPJmL spatial resolution
# Average farm sizes vary: USA ~180 ha, EU median ~5 ha (Our World in Data, 2020)
#
# CAPITAL DYNAMICS: FAO ENDOWMENT + OWN DEVIATIONS
# -------------------------------------------------
# FAO sets the initial stock, and from then on it moves by what this farm earns
# and spends relative to its own starting point:
#
#   K_{t+1} = K + Δrevenue - Δcosts
#
# where:
#   - Δrevenue = current_revenue - baseline_revenue
#   - Δcosts = cost difference between current and baseline bundle
#
# BASELINES (set at initialization):
#   - baseline_revenue: Average over historic period (2015-2025 LPJmL data)
#   - baseline_bundle: Initial practice bundle at simulation start
#
# A farm that neither earns nor spends more than it used to holds its stock
# steady; better yields or the running savings of no-till grow it, and worse
# yields or the added cost of a practice shrink it.
#
# References:
#   - FAO (2023). FAOSTAT Capital Stock (initial endowment)
#   - Farm Financial Scorecard (CFFM, University of Minnesota)
#   - Davis, J. (2022). "Farm's Target for Working Capital." SDSU Extension.
#
farm_economics:
    # Whether the capital stock may block a change the farmer wants to make:
    # the survival gate, the forced deselection of practices that have become
    # unaffordable, and the trimming of a target bundle to what the stock can
    # buy. Switched off, capital is still tracked and still drives profit, but
    # nothing is refused for lack of it - credit is assumed available whenever a
    # practice pays off, and adoption is then limited only by whether it does
    # (PBC) and by the behavioural side.
    #
    # A stock of productive capital is only a proxy for access to finance: a
    # change that pays for itself is normally financed, so refusing it because
    # this year's equipment stock is thin overstates the barrier. Where it does
    # bind is the poorest countries, whose credit markets fail. Kept on by
    # default so that case is represented, and exposed here so the assumption
    # can be tested rather than assumed.
    capital_constraints: true
    # Minimum capital buffer as fraction of initial capital.
    # Below this threshold, farmers are forced to deselect practices.
    # Farm liquidity research shows working capital is typically 15-30% of total
    # assets (Barry et al. 2000; Mishra & Morehart 2001). Smallholders often have
    # even lower liquidity (10-25%) as most capital is locked in equipment and
    # land (Fafchamps 1992; Rosenzweig & Wolpin 1993). Using 0.70 means farmers
    # keep 70% as survival buffer, leaving 30% liquid - a reasonable midpoint.
    # Note: FAO NCS excludes land (SNA 2008 definition), so this fraction
    # applies to productive capital (machinery, equipment, buildings).
    min_capital_fraction: 0.70

# Practice costs (USD per hectare)
# Each cost is a [min, max] range interpolated by where the country's GDP per
# capita falls between the global 10th and 90th percentiles:
#   cost = min + (max - min) × gdp_cost_ratio,  gdp_cost_ratio in [0, 1]
#
# Cost components are additive - code sums all entries in 'costs' dict.
# For cover_crop/residue_on_field: positive = annual cost when practice is active.
# For tillage: costs are defined for conventional tillage (tillage=1); negated for
# no-till (tillage=0). Herbicide can be negative (lower chemical use with tillage).
# New components can be added without code changes.
#
# Note: When capital is low, practices are deselected in order of direct cost
#       (highest first): cover_crop > residue > tillage
#
# References:
#   [1] University of Illinois farmdoc (2023). Machinery Cost Estimates: Field Operations.
#       https://farmdoc.illinois.edu/assets/management/machinery-costs/field_operations_2023.pdf
#   [2] USDA CEAP (2022). Save Money on Fuel with No-Till Farming.
#       https://www.farmers.gov/blog/save-money-on-fuel-with-no-till-farming
#   [3] No-Till Farmer (2022). Fuel Savings Analysis. $17/acre = $42/ha.
#       https://www.no-tillfarmer.com/articles/12068-usda-save-17-per-acre-on-fuel-by-switching-to-no-till
#   [4] SARE (2019). Cover Crop Economics. https://www.sare.org/wp-content/uploads/Cover-Crop-Economics.pdf
#   [5] Indigo Ag / Iowa State (2020). Cover Crop Equipment & Custom Rates.
#       https://app.indigoag.com/programs/learn/paper/what-equipment-is-needed-to-plant-cover-crops
#   [6] CMV360 (2026). Zero Tillage in India: Prices, Subsidies, ROI.
#       Custom hire rates: ₹500-900/acre = $15-27/ha.
#       https://www.cmv360.com/tractors/articles/zero-tillage-in-india-2026
#   [7] Hossain et al. (2017). Cost effective small No-till seeder for Bangladesh.
#       Bangladesh J. Agril. Res. 42(1): 27-34. Small seeder cost: $350-400.
#       https://doi.org/10.3329/bjar.v42i1.31970
#   [8] Modern Ag Alliance (2025). Crop Protection and Farm Bill Programs.
#       Labor: $7.54-14.65/acre = $19-36/ha additional for conventional tillage.
#   [9] SD State Extension (2026). Economic Advantages of No-Till: Diesel Fuel.
#       Equipment: $15-30/acre = $37-74/ha higher for conventional tillage.
#       Repair costs 30-50% higher in multi-pass tillage systems.
#   [10] Soil Health Partnership / EDF (2021). Conservation tillage reduces operating costs.
#        Burndown herbicide: +$9.33/acre = $23/ha for no-till.
#   [11] Bowman et al. (2024). Herbicide use for conservation tillage adoption.
#        PLOS One 19(11), e0311960. Herbicide: +$6/acre = $15/ha baseline.
#   [12] Myers, Weber & Tellatin (2019). Cover Crop Economics: Opportunities to
#        Improve Your Bottom Line in Row Crops. SARE Technical Bulletin.
#        Where herbicide-resistant weeds are substantial to severe, cover crops
#        save $27/acre = $67/ha: $12/acre = $30/ha from one fewer post-emergence
#        pass (product $4.50 + application $7.50 per acre) and $15/acre = $37/ha
#        from switching to a cheaper residual chemistry.
#   [13] Myers (2026). Managing Cover Crops Profitably, Ch. 2. SARE.
#        Cereal rye before soybean where resistance is an issue: herbicide
#        savings of $10-20/acre = $25-50/ha.
#   [14] Buckles et al. (eds., 1998). Cover Crops in West Africa: Contributing
#        to Sustainable Agriculture. IDRC/IITA/Sasakawa Global 2000.
#        Mucuna fallow on the Adja Plateau (Benin) cut Imperata cylindrica from
#        270 to 32 plants/m2; fields that needed an estimated 60-80 person-days
#        /ha to clear the weed then needed a fraction of that labour. Mucuna
#        seed is largely saved and exchanged between farms rather than bought.
#   [15] Soil Health Exchange (2026). Fall Cover Crops: Rates, Costs and
#        Nitrogen Credits. Drilled pure-stand rates against a retail price
#        snapshot of Aug 2026: cereal rye $0.30/lb at 60-120 lb/ac, hairy vetch
#        $2.20/lb at 15-20 lb/ac, crimson clover $2.20/lb.
#   [16] Schnitkey & Sellars (2018). Understanding Budget Implications of Cover
#        Crops. farmdoc daily 8(112), University of Illinois. Central Illinois
#        budget: seed $0.25/lb for cereal rye and $2.24/lb for hairy vetch,
#        giving $15/acre for rye at 60 lb and $45/acre for a 15 lb vetch +
#        45 lb rye blend, before the $13.40/acre drilling charge.
#   [17] HELCOM (2024). Experiences on economic incentives in the Baltic Sea
#        region to enhance nutrient recycling and reduce nutrient losses.
#        Sweden taxed mineral fertiliser nitrogen at SEK 1.80/kgN (EUR 0.18)
#        from 1995 to 2009; Denmark levies DKK 5/kgN, with registered users
#        exempt. Both are taxes on nitrogen bought, not on nitrogen lost.
#   [18] Le Goffe (2013). The Nitrates Directive: incentives, cost-effectiveness
#        and the Dutch MINAS. Notre Europe / Jacques Delors Institute. MINAS
#        (1998-2005) charged nitrogen losses above a levy-free surplus at
#        EUR 0.68/kgN, raised to EUR 2.53-5.07/kgN in 2002 to a level at which
#        eliminating the loss always beat paying the penalty.
#   [19] Keeler et al. (2016). The social costs of nitrogen. Science Advances
#        2(10), e1600219. Damage from nitrogen leaching to groundwater in the
#        US Corn Belt, $0.60-13/kgN depending on the receiving water.
#   [20] Rennert et al. (2022). Comprehensive evidence implies a higher social
#        cost of CO2. Nature 610, 687-692. Mean SC-CO2 of $185/tCO2 (2020 USD,
#        2% near-term discount rate), 5-95% range $44-413.
#   [21] Schulte-Uebbing & de Vries (2021). Assessment of spatially explicit
#        actual, required and critical nitrogen inputs in EU-27 agriculture.
#        Wageningen University. Critical N leaching computed as the
#        precipitation surplus times 11.3 mgN/l, the 50 mg NO3/l drinking-water
#        limit expressed as N; 2.5 mgN/l is used where surface waters are the
#        receptor. The Nitrates Directive itself sets no leaching limit - its
#        170 kgN/ha is a cap on manure applied, not on nitrogen lost. Finds
#        the surface-water threshold binding (43% input cut needed) and the
#        groundwater one close to actual inputs.
#   [22] Rockstrom et al. (2023). Safe and just Earth system boundaries.
#        Nature 619, 102-111, with Schulte-Uebbing et al. (2022). The nitrogen
#        boundary rests on a critical surface-water concentration of 2.5 mgN/l
#        to prevent eutrophication, tolerance range 1-4 mgN/l.
#   [23] Umweltbundesamt (2024). Critical Limits for Acidification and
#        Nutrient Nitrogen. The EU Drinking Water Directive guide value of
#        25 mg NO3/l, i.e. 5.6 mgN/l, used as a precautionary upper bound.
#   [24] USDA NRCS. Environmental Quality Incentives Programme (EQIP), under
#        the Food Security Act 1985 sec. 1240B(d). Payments are a share of
#        costs incurred and income foregone, capped at 75% for most producers
#        and 90% for historically underserved ones. Cover crop practice
#        payments run $34-75/acre = $84-185/ha.
#   [25] USDA NRCS Conservation Stewardship Programme (CSP), residue and
#        tillage management enhancements, $5-25/ha; and Regulation (EU)
#        2021/2115 Arts. 31 and 70, under which eco-scheme and agri-environment
#        payments compensate "additional costs incurred and income foregone",
#        in practice EUR 20-50/ha for soil cover and EUR 40-165/ha for wider
#        soil conservation.
#
practice_costs:
    tillage:
        # ONE-TIME TRANSITION COST (equipment)
        # US literature value: $66/ha (no-till planter amortized) [1]
        # India custom hire: ₹500-900/acre = $15-27/ha [6]
        # Bangladesh small seeder: $350-400 total ≈ $7-10/ha amortized [7]
        # SYMMETRIC: Applied in BOTH directions (equipment needed either way)
        transition: [40.0, 66.0]   # $/ha [1,6,7]

        # ANNUAL OPERATING COSTS (conventional tillage relative to no-till)
        # Defined for TILLAGE (tillage=1): positive = higher cost vs no-till baseline.
        # No-till (tillage=0) is the REFERENCE POINT with cost = 0.
        # Switching from conventional to no-till SAVES money (negative cost diff).
        # Switching from no-till to conventional COSTS more (positive cost diff).
        # Range: [low-capital, high-capital]
        costs:
            # Higher fuel use from extra field passes (4-6 conv vs 1-2 no-till)
            # USA: 4 gal/acre extra × $4-5/gal = $16-20/acre = $40-50/ha [2,3]
            # Low-capital: less mechanization, smaller tractors, less baseline fuel
            fuel: [15.0, 45.0]         # $/ha/yr [2,3]

            # Higher labor from extra field operations
            # USA: 4-6 extra passes × ~$3-6/acre/pass = $12-36/acre = $30-90/ha
            # Conservative estimate: $19-36/ha [8]
            labor: [5.0, 25.0]         # $/ha/yr [8]

            # Higher equipment/repair costs from machinery wear
            # USA: 30-50% higher repair costs for conventional = $15-30/acre [9]
            equipment: [8.0, 30.0]    # $/ha/yr [9]

            # Lower herbicide use (mechanical weed control replaces chemicals)
            # USA: burndown avoided +$9/acre = $23/ha [10]; net +$6-20/acre [11]
            # Negative = cost reduction vs no-till (herbicide savings with tillage)
            herbicide: [-8.0, -35.0]   # $/ha/yr [10,11]

        # NET ANNUAL COST when tillage=1 (sum of components):
        #   Low-capital:  15 + 5 + 8  - 8  =  20 $/ha/yr vs no-till
        #   High-capital: 45 + 25 + 30 - 35 =  65 $/ha/yr vs no-till
        # When tillage=0 (no-till): cost = 0 (reference point)
        # Cost DIFFERENCE (conv→no-till) = 0 - 65 = -65 $/ha/yr (savings)

    cover_crop:
        # ONE-TIME TRANSITION COST (seeder equipment)
        # US literature value: $20/ha transition (seeder attachment) [4,5]
        # Low-capital: simple broadcasting vs precision drilling
        # ASYMMETRIC: Only applied when ADOPTING (0→1), not abandoning (1→0)
        # Abandoning cover crops = just stop planting, no new equipment needed
        transition: [12.0, 22.0]   # $/ha [4,5]

        # ANNUAL OPERATING COSTS
        # Costs are positive, subsidies are NEGATIVE (reduce net cost)
        costs:
            # Seed purchase costs, which is where the two cover crop types
            # differ. Exactly one of these applies - whichever crop is in the
            # ground - and the choice between them is made in
            # indicate_cover_crop_type. A legume buys nitrogen fixation and a
            # grass buys nitrogen capture, and the legume costs about twice as
            # much per hectare to sow.
            #
            # Drilled US rates against a 2026 retail price snapshot [15]:
            #   cereal rye   60-120 lb/ac @ $0.25-0.30/lb = $18-36/ac = $44-89/ha
            #   hairy vetch  15-20  lb/ac @ $2.20-2.60/lb = $33-44/ac = $82-109/ha
            # farmdoc's central Illinois budget separates the same two: seed
            # alone is $15/ac for cereal rye and $45/ac for a rye/vetch blend
            # [16]. Both sources put the legume at 2-3x the grass.
            #
            # High-capital sits at the low end of those drilled ranges rather
            # than the middle, because the range is a global high-income
            # average and not a Corn Belt one: lighter rates, broadcasting and
            # rye-heavy blends all pull below a pure drilled stand.
            #
            # Low-capital: local species (oats, millet, mucuna, lablab) at
            # lower rates, and a large share of seed saved from last year
            # rather than bought. Farm-saved seed is commonest for the legumes
            # - mucuna in West Africa is normally exchanged, not purchased [14]
            # - so the cash gap between the two narrows at this end.
            seeds_nonlegume: [18.0, 65.0]  # $/ha/yr [4,15,16]
            seeds_legume: [30.0, 85.0]     # $/ha/yr [14,15,16]

            # Seeding/planting labor and fuel
            # USA: $10-15/acre = $25-37/ha for drilling [4]
            # Low-capital: cheaper labor, often broadcasting vs drilling
            labor: [15.0, 20.0]        # $/ha/yr [4]

            # Termination costs (rolling/crimping or burndown herbicide)
            # USA: $5-15/acre = $12-37/ha [4]
            # Low-capital: often mechanical termination, cheaper herbicide
            termination: [12.0, 15.0]  # $/ha/yr [4]

            # IN-SEASON WEED CONTROL SAVED (NEGATIVE = reduces costs)
            # Cover crop biomass suppresses part of the weed pressure the
            # following crop faces. Distinct from 'termination' above, which is
            # the kill operation itself.
            # Credited only under no-till (see get_bundle_direct_cost_per_ha):
            # where the field is still tilled, cultivation already does this.
            #
            # High-capital: weed control runs on herbicide. USA: $67/ha saved
            # where herbicide-resistant weeds are severe [12], $25-50/ha for
            # cereal rye before soybean [13]. Those are the resistant-weed
            # cases, not the average field, and suppression does not always
            # change the spray programme, so we take about half of the single
            # avoided post-emergence pass ($30/ha [12]).
            # Low-capital: weed control is hand hoeing, so the saving is labour
            # rather than chemical. Mucuna fallow in Benin freed a large share
            # of the 60-80 person-days/ha spent clearing Imperata [14]; an
            # off-season cover crop is far weaker than a full-year fallow, so
            # we credit ~3 person-days/ha at rural wages of $1.5-2/day.
            # Set to [0, 0] to switch the credit off.
            weed_control: [-5.0, -15.0]  # $/ha/yr [12,13,14]

        # NET ANNUAL COST (sum of components), under no-till, by type:
        #   Low-capital,  non-legume: 18 + 15 + 12 -  5 = 40 $/ha/yr
        #   Low-capital,  legume:     30 + 15 + 12 -  5 = 52 $/ha/yr
        #   High-capital, non-legume: 65 + 20 + 15 - 15 = 85 $/ha/yr
        #   High-capital, legume:     85 + 20 + 15 - 15 = 105 $/ha/yr
        # Under conventional tillage the weed control credit does not apply,
        # so each figure is 5-15 $/ha/yr higher.
        #
        # The legume is the expensive option and has to earn its seed back in
        # fixed nitrogen. The catch crop is the cheaper one, and earns its keep
        # by holding nitrogen that would otherwise leach - worth little on its
        # own, and worth the difference once policy.nitrogen_charge prices the
        # loss. A payment for holding the practice, if a scenario turns one
        # on, is policy.practice_subsidies.cover_crop.

    residue_on_field:
        # Modern combines have straw choppers/spreaders as standard equipment.
        # No additional equipment needed for retention vs removal.
        # Purdue Extension CT-5: spreaders/choppers are standard attachments.
        transition: 0.0    # $/ha - no special equipment needed

        # Opportunity cost is computed DYNAMICALLY using compute_residue_opportunity_cost()
        # which calculates: crop_revenue × use_cost_fractions
        # Based on Singh & Schiere (1995): straw value = 10-15% of crop value.
        # This makes residue costs spatially and temporally variable with yields.
        # No static cost components: retaining costs exactly the straw income
        # given up. A payment for holding the practice, if a scenario turns
        # one on, is policy.practice_subsidies.residue_on_field, or a share of
        # this cost via policy.practice_subsidies.residue_on_field_share.

# Soil carbon accounting depth
# ----------------------------
# How deep a stock of agricultural soil organic carbon is summed, in mm. It has
# to be the lower boundary of an LPJmL soil layer. soilc_agr_layer stores each
# layer's own carbon, not a running total: band k is the layer ending at that
# depth (0-200, 200-500, 500-1000, 1000-2000, 2000-3000 mm), and the stock to
# a depth is the sum of the bands whose lower boundary is at most that depth.
#
#   200   0-20 cm. The top layer, and the stock every published run used. A
#         configuration that does not set this still reads that layer.
#   500   0-50 cm
#   1000  0-100 cm
#   2000  0-200 cm
#   3000  0-300 cm, the whole profile the model carries
#
# One depth for every read of the stock. The carbon payment, the payment a
# farm anticipates when it weighs a practice, the soil metric it scores, the
# historic baseline and the memory seeded from it, the reference scales, the
# conventional drift an avoided-loss payment is written against, and the
# soilc output are all this number. Paying a farm on a stock it does not see
# would credit a change it never learned from.
#
# Schemes that pay for soil carbon sample 0-30 cm: Verra VM0042, the Climate
# Action Reserve Soil Enrichment Protocol, and the IPCC Tier 1 default
# stocks. LPJmL has no 30 cm boundary. The nearest layers are 0-20 cm and
# 0-50 cm, so 500 is the model depth a 30 cm scheme can be set next to, and
# it is not that scheme. A run at one depth is a different stock from a run
# at another, and the two are not comparable.
soil_carbon_depth: 200   # mm, a layer lower boundary

# Policy instruments
# ------------------
# Every instrument the model has, and all of them zero by default, so the
# model as configured is the counterfactual and any run with an instrument has
# one to be compared against. Nothing that transfers money to or from a farm
# on policy grounds belongs anywhere else in this file.
#
# Three of them, in two families. The carbon price and the nitrogen charge are
# priced on quantities the farm's own record already carries - carbon put into
# the soil above baseline, nitrogen actually lost - as the real instruments
# would be written. The practice subsidies are paid for holding a practice,
# whether or not it was just adopted: per hectare, or - for residue, whose
# cost this model derives per farm - as a share of that cost.
#
# Only the part a farm can change by farming differently enters its decisions,
# because the rest is the same whatever it chooses and cancels out of every
# comparison. The whole bill still lands on capital, which in a ledger whose
# other terms are deviations from baseline means a high enough charge walks
# every farm down to the capital floor whether or not it changes practice.
# That is harsher than reality, where a tax is paid out of gross income and not
# out of the machinery shed, so read a run with a large nitrogen_charge as an
# upper bound on the decapitalisation.
policy:
    # Payment for soil carbon accumulated above the farm's own baseline, in USD
    # per tonne of CO2 equivalent. Rennert et al. (2022) put the social cost of
    # carbon near $185/tCO2 with a 5-95% range of $44-413 [20]; compliance
    # markets are lower, with the EU ETS in the EUR 60-90/tCO2 band and
    # voluntary soil carbon contracts often below $30/tCO2. A run wanting the
    # damage-cost framing should use the Rennert figure and one wanting the
    # market framing something near 30.
    #
    # A SINGLE GLOBAL NUMBER, not a [low, high] pair like every cost above.
    # Carbon is a global externality: a tonne is a tonne wherever it is put
    # away, so one price is what correctly values it, and carbon markets are
    # built that way for the same reason. Paying a low-income farm less for the
    # same tonne would misprice it and would push sequestration towards where
    # the price is high rather than where it is cheap - the spillover a
    # differentiated price creates and a uniform one does not.
    #
    # Paid on gains and never charged on losses (see
    # `creditable_soilc_accumulation`), which is the asymmetry real schemes
    # carry and the reason abandoning a practice stays cheap. What counts as a
    # gain is `carbon_price_basis` below.
    #
    # Suggested values:
    #   50   compliance-market framing, between voluntary (~30) and EU ETS (~80)
    #   185  damage-cost framing, Rennert et al. mean social cost of carbon
    carbon_price: 0.0        # $/tCO2e [20]

    # What that price is actually paid on.
    #
    # stock_gain is the default and the only basis the published runs used: the
    # rise in the farm's own stock, floored at zero, which is how soil carbon
    # protocols are written. It has a consequence that only shows up on land
    # that is losing carbon anyway, and most cropland here is. A practice that
    # turns a loss of 8 gC/m2/yr into a loss of 2 has kept 6 out of the air and
    # is paid nothing for it, because the stock still fell. Meanwhile the farm's
    # expectation of the payment is formed on the difference between two
    # bundles, which is positive - so the farm adopts expecting carbon revenue,
    # receives none, and its neighbours read an adopter whose accounts the
    # scheme never improved. The instrument is then weaker than a flat practice
    # payment for a reason that has nothing to do with its rate.
    #
    # avoided_loss credits the departure from the farm's own pre-adoption loss
    # rate, carried forward by the drift of land that did not change practice.
    # The anchor is the farm's own carbon balance before it moved, so a farm on
    # degrading land is measured against a steeper line than one on stable
    # land; the drift term is climate, which the farmer did not cause, so
    # adding it leaves them neither paid nor blamed for it. A farm that only
    # holds its slope flat while conventional land steepens therefore earns a
    # widening credit. Crossing from loss into genuine gain needs no special
    # case: it is one difference of slopes throughout.
    #
    # avoided_loss_benchmark drops the anchor and credits the departure from
    # the contemporaneous conventional population alone - the
    # performance-standard baseline of the protocol literature. Also what the
    # avoided_loss basis falls back to for a farm that moved before it had
    # three years of record to freeze an anchor from, which is most pioneers.
    #
    # Either avoided-loss basis is credited only to farms that actually
    # enrolled, and both stay floored at zero, so a scheme is still something a
    # cautious farm will touch. Note for a write-up that these credit avoided
    # emissions rather than removals, except in the part above zero, and so are
    # not interchangeable with removals one tonne for one.
    #
    # Switching this changes what farms are paid and therefore what their peers
    # learn, so runs made on different bases are not comparable with each other.
    carbon_price_basis: stock_gain

    # Whether a farm may draw the practice payment and the carbon payment
    # together.
    #
    # false pays both, which is what the headline "both instruments" scenario
    # does and what a referee is entitled to call paying twice for one action:
    # the farm is paid for holding the practice, and again for the carbon the
    # practice put away. true pays the larger of the two and not the sum,
    # which is what agri-environment rules against double compensation
    # actually require.
    #
    # The larger, rather than withholding the practice payment from anyone who
    # earns a carbon credit, which is the other reading of the same rule. That
    # version has a perverse edge: a farm sequestering a few gC would forfeit a
    # whole per-hectare payment for it, so the rational response is to leave
    # the carbon scheme rather than to sequester less, and the run would be
    # measuring that exit rather than the value of stacking.
    #
    # Only bites where both instruments are on, so it changes nothing in the
    # single-instrument scenarios. Applied identically to the bill
    # (CAFarmer.update_capital) and to the expectation of it
    # (anticipated_policy_transfer), so a farm cannot decide on a payment it
    # will not receive.
    no_stacking: false

    # Charge on nitrogen leached below the root zone, in USD per kg N, as
    # [low-income, high-income] and interpolated on the same GDP ratio as the
    # practice costs. Unlike carbon, nitrogen damage is local - it depends on
    # the aquifer and on who drinks from it - so the rate that internalises it
    # is local too, and a country sets it against what its farms can bear.
    #
    # On the loss, not on the input. A charge on fertiliser applied would fall
    # on every farm in proportion to something the model treats as exogenous,
    # and would give a cover crop no credit for holding nitrogen in place.
    #
    # The Dutch MINAS levy is the precedent that matches this base, being the
    # one scheme that charged nitrogen losses rather than purchases: EUR 0.68
    # /kgN at introduction in 1998, raised to EUR 2.53-5.07/kgN in 2002 at
    # which point eliminating the loss was always cheaper than paying [18].
    # Taxes on fertiliser bought were milder - Sweden SEK 1.80/kgN (~$0.20),
    # Denmark DKK 5/kgN (~$0.73) [17] - and had correspondingly small effects.
    # Keeler et al. (2016) put the damage itself at $0.60-13/kgN, the spread
    # being mostly about population downstream rather than about the nitrogen
    # [19]. So roughly: $0.5-1 is a mild tax, $3 is MINAS at its prohibitive
    # setting, and anything near 13 is the damage-cost ceiling and not a rate
    # any government has levied.
    #
    # MINAS charged only the surplus above a levy-free allowance, and so can
    # this - see levy_free_concentration. With that at zero every kilogram is
    # charged and the same number bites harder here than it did in the
    # Netherlands.
    #
    # Suggested values:
    #   [0.5, 2.0]  moderate — mild at low income, meaningful at high income
    #   [1.0, 3.0]  MINAS-level — high end is prohibitive, abatement beats paying
    nitrogen_charge: [0.0, 0.0]   # $/kgN [17,18,19]

    # Leaching below this nitrate concentration is not charged, in mgN/l. The
    # allowance is a concentration rather than a mass because that is how a
    # nitrate standard is written and because it is the concentration reaching
    # the aquifer that does the damage: the same kilogram is harmless in a wet
    # cell and not in a dry one. Each farm's allowance in mass terms is
    # therefore its own,
    #
    #     allowance [gN/m2] = levy_free_concentration x runoff [mm] / 1000
    #
    # a millimetre over a square metre being a litre, and the charge falls on
    # what it loses above that.
    #
    # Three defensible settings, and they differ by a factor of four, so this
    # is a scenario choice and not a detail:
    #
    #   2.5   the planetary boundary. Critical N concentration in runoff to
    #         surface water, set to protect aquatic ecosystems from
    #         eutrophication; this is the limit behind the nitrogen Earth
    #         system boundary [22] and the EU critical-N work [21], with a
    #         tolerance range of 1-4. Allowance ~4 kgN/ha at 150 mm of
    #         drainage, 7.5 at 300 mm, 12.5 at 500 mm.
    #   5.6   the EU Drinking Water Directive guide value of 25 mg NO3/l,
    #         used in critical-limits work as a precautionary upper bound
    #         [23]. Roughly twice the allowance above.
    #   11.3  the WHO/EU drinking-water limit of 50 mg NO3/l as nitrogen.
    #         Allowance ~17 kgN/ha at 150 mm, 34 at 300 mm, 57 at 500 mm.
    #
    # Which one is a judgement about the receptor, and the two are not equally
    # binding. The EU-27 assessment found the surface-water threshold needs a
    # 43% cut in N inputs while the groundwater threshold is close to actual
    # inputs and exceeded on only 18% of agricultural land [21]. So 11.3 is a
    # standard most farms already meet: charging against it collects almost
    # nothing and changes almost nothing, which is the argument for 2.5 if the
    # instrument is meant to bite.
    #
    # Set to 5.0 below: a lenient reading of the boundary, twice the
    # eutrophication limit and just under the drinking-water guide value.
    # Cite it as a choice, NOT as the planetary boundary, which is 2.5. Worth
    # a sensitivity run across 2.5 / 5.0 / 11.3, since the allowance and so
    # the tax base move almost linearly with it.
    #
    # Not a [low, high] pair: the limit is a health standard, and what is safe
    # to drink does not depend on a country's income. Only the rate above does.
    #
    # Do NOT set this from the MINAS allowance of 100-140 kgN/ha. That was a
    # farm-gate surplus, inputs minus offtake, of which only a part ever
    # leaches; used here as a leaching allowance it would exempt every farm.
    #
    # An allowance only, so it does nothing while nitrogen_charge is zero and
    # the counterfactual is untouched. Set here rather than left at zero so
    # that turning the charge on gives a tax written against a standard,
    # rather than one that bills every kilogram lost.
    levy_free_concentration: 5.0   # mgN/l [21,22,23]

    # Annual payment for holding a practice, in USD per hectare per year, as
    # [low-income, high-income] and interpolated on the same GDP ratio as the
    # practice costs - a subsidy is paid out of a national budget, so what a
    # country pays tracks what it can afford.
    #
    # Positive is a payment to the farmer. Paid every year the farm is
    # committed to the practice, not only in the year it switches, which is
    # how EQIP and the CAP eco-schemes work. Paid on commitment, not on
    # certification: a farm whose stubble happens to clear the 30% threshold
    # never enrolled in anything, and section 8.2 keeps the two apart
    # everywhere else too.
    #
    # Literature for the calibration:
    #   cover_crop        US EQIP $34-75/acre = $84-185/ha at 50-75%
    #                     cost-share [24]; EU CAP eco-schemes EUR 40-165/ha for
    #                     soil conservation [25]. Annual costs are $40/ha
    #                     low-capital and $85/ha high-capital for a non-legume,
    #                     $52 and $105 for a legume, so no single flat rate is a
    #                     cost-share of both. This rate covers the catch crop
    #                     and cover_crop_legume covers the difference.
    #   residue_on_field  US CSP $5-25/ha for residue management, EU CAP
    #                     eco-schemes EUR 20-50/ha [25]. Both bracket the straw
    #                     income given up in a typical cell, which is smaller
    #                     than it looks - see the note on the flat rate below.
    #
    # Zero by default, like every other instrument here.
    #
    # Suggested values:
    #   cover_crop: [40, 85]             full cost-share of a catch crop
    #   cover_crop_legume: [15, 25]      EQIP 340's multi-species tier
    #   residue_on_field_share: 0.75     EQIP's statutory cost-share ceiling
    practice_subsidies:
        cover_crop: [0.0, 0.0]        # $/ha/yr [24,25]

        # Paid on top of cover_crop where the crop sown is a legume, and the
        # only rate here that separates the two crops. A tier rather than a
        # device: EQIP 340 posts one, paying a multi-species mix above a basic
        # single-species stand, and the CAP treats a nitrogen-fixing crop as a
        # different category from a catch crop rather than the same one at a
        # different price - GAEC 8 weights a catch crop at 0.3 against 1.0 for
        # a nitrogen-fixing crop, and Greece pays EUR 50/ha for sowing legumes
        # on arable land.
        #
        # EQIP is the one that posts the tier as a difference, so it sets the
        # rate here. From the general cost list, practice 340:
        #   basic                    $35.73/ac    multi-species  $42.73/ac
        #   basic, underserved       $50.62/ac    multi-species  $60.53/ac
        # so the enhancement is $7.00/ac and $9.91/ac, or $17-25/ha. Nebraska's
        # NWQI schedule gives $7.21/ac from an entirely separate calculation.
        #
        # That range also clears what the enhancement has to beat to change any
        # decision. A farm sows the legume when the yield advantage covers the
        # extra seed; the advantage is 1-2% of yield at cell level and the seed
        # premium is $12-20/ha (seeds_legume less seeds_nonlegume), so the two
        # very nearly cancel and the choice is settled by noise - which is why
        # runs land near a two-to-one split toward the catch crop whatever else
        # is switched on. [15, 25] passes the premium at both ends without
        # swamping the yield evidence.
        #
        # Note what this rate steers. cover_crop is paid whichever crop is
        # sown, so it cancels out of the legume-versus-catch-crop comparison
        # and can only change whether a cover crop is grown. This one does not
        # cancel, so it is the only rate here that can change which.
        #
        # Suggested value:
        #   cover_crop_legume: [15, 25]   EQIP 340's multi-species tier
        cover_crop_legume: [0.0, 0.0]  # $/ha/yr [24,25]

        # Retention is paid one of two ways, and setting both is an error.
        #
        # A flat rate per hectare, as [low-income, high-income]. Simple, and
        # what CSP and the CAP eco-schemes post - but it sits badly against
        # this model's residue cost, which is the straw income actually given
        # up: crop revenue x 0.125 x the share of straw that region removes
        # (Singh & Schiere 1995; MADRaT). That share runs from about 0.05 to
        # 0.85 across cells, so the same flat rate over-pays several-fold
        # where straw is left on the field anyway and covers a fraction of the
        # cost where straw is genuinely traded - backwards, since the farms
        # that need paying are the ones retention actually costs.
        #
        # Suggested value, if a scenario wants the flat form:
        #   [10, 25]  ~75% of the median cost at both ends, inside the
        #             $5-25/ha US CSP posts for residue management [25]
        residue_on_field: [0.0, 0.0]  # $/ha/yr [25]

        # Or a share of that same opportunity cost, which is the form the real
        # schemes are written in and the one that tracks the variation above.
        # EQIP pays a percentage of costs incurred and income foregone, and EU
        # agri-environment payments are defined as compensation for additional
        # costs and income foregone - and residue retention's cost is income
        # foregone, which this model already computes per farm.
        #
        # A SINGLE FRACTION, not a [low, high] pair and not GDP-scaled: the
        # cost it applies to is already local, so a share that also varied by
        # income would count that gradient twice. EQIP's own gradient runs the
        # other way, paying a larger share to underserved producers.
        #
        # Applied to the frozen baseline straw cost, the same figure a
        # retaining farm is charged, so the number is exactly the fraction of
        # the cost the farm does not bear.
        #
        # Suggested values:
        #   0.5   the low end of EQIP's standard cost-share band [24]
        #   0.75  EQIP's statutory ceiling for most producers, and the
        #         default choice: retention still costs the farm a quarter,
        #         so the practice is compensated rather than made free [24]
        #   1.0   full compensation for income foregone, the EU upper bound
        residue_on_field_share: 0.0   # fraction of straw opportunity cost [24,25]

    # Years any instrument is in force, both inclusive: an instrument acts in
    # start_year and still acts in end_year.
    #
    # BOTH DEFAULT TO THE COUPLED RUN ITSELF - start_coupling to lastyear, read
    # off the LPJmL config - and are best left unset. A literal year here is a
    # second copy of something the simulation already knows, and the two go out
    # of step the moment the run period moves. Setting start_year to 2025 and
    # later coupling from 2030 reads as "from the start", which is harmless;
    # the other way round it back-dates an instrument into the years farms
    # learned from, which is the one thing this must not do.
    #
    # So set these only to phase an instrument in or out inside the run, and
    # prefer `windows` below when it is one instrument rather than all of them.
    #
    # Ending a scheme is worth doing deliberately: the practice subsidies and
    # the carbon payment are absolute transfers, so leaving them on simply
    # accumulates in the capital stock. Withdrawing one asks the more
    # interesting question - whether the practice survives without it, or
    # whether the adoption was only ever rented.
    #
    # start_year: 2025
    # end_year: 2100

    # Per-instrument overrides of that window, both inclusive, for scenarios
    # that phase instruments in or out separately - a carbon price introduced
    # late, a subsidy withdrawn early to see what sticks. Any instrument not
    # named here uses the global window above. Keys are carbon_price,
    # nitrogen_charge, cover_crop and residue_on_field.
    #
    # windows:
    #     carbon_price: [2030, 2100]
    #     cover_crop: [2025, 2035]
    windows: {}

# Materiality thresholds
# ----------------------
# Each of these replaces a bare "> 0" test. A quantity being non-zero does not
# make it meaningful: a cell holding a few hectares of cropland is a rounding
# artefact of the land-use input rather than a farm, and a near-zero quantity
# amplifies the decision signal instead of normalising it, because every metric
# enters the performance score relative to its own baseline.
materiality:
    # Minimum share of a cell under crops for it to carry a farmer. Expressed
    # as a fraction rather than hectares because cell area shrinks towards the
    # poles, so an absolute area cut would tighten with latitude.
    min_crop_fraction: 0.01

    # The level of each environmental metric at which a difference stops being
    # worth noticing, in the metric's own physical unit. Both sides of the log
    # deviation are offset by it, ln((v + n) / (b + n)), so a farm whose
    # historic mean is a rounding error reports no change when nothing changed,
    # and a swing between two physically trivial values stays small instead of
    # being amplified into a spectacular one. See farmer.log_rate.
    #
    # Each is set at the point where the quantity stops mattering agronomically,
    # not tuned: a tenth of a milligram of nitrate per litre, a hundredth of a
    # tonne of soil carbon, a centimetre of water in the root zone.
    negligible_yield: 10.0                # gC/m2, ~0.2 t DM/ha
    negligible_soilc: 100.0               # gC/m2, croplands carry 1000-5000
    negligible_moisture: 10.0             # mm
    # gN/m2/yr (1 kgN/ha), ~5% of a typical 1-4 gN/m2 loss, in line with the
    # offsets above. Also sets how hard a year without drainage can swing the
    # metric: the flux really does go to zero in one, and this is what stops
    # ln(0/baseline) from running away.
    negligible_leaching: 0.1

    # Revenue keeps a lower bound rather than an offset, because profit enters
    # the score as asinh(delta / baseline_revenue) and so divides by revenue
    # without taking its log. Per farm, and therefore scaled by cropped area.
    baseline_floor_revenue_per_ha: 50.0   # $/ha/yr

# TPB specifc settings and parameters
tpb:
    transition_threshold: 0.5   # TPB threshold for any practice change

    # Performance scoring settings
    # Toggle between profit-based and yield-based economic metric
    # - true: Use profit (delta_profit / baseline_revenue) for economic performance
    # - false: Use yield for economic performance (traditional approach)
    # When true, weight_profit is used; when false, weight_yield is used.
    use_profit: true  # Default: use profit rate (% improvement over baseline)

    # All five metrics, profit included, are scored against scales derived from
    # the farmer population rather than against tuning constants; see
    # CAWorld.compute_reference_scales. A score difference of 1 therefore already
    # means one ordinary spread of variation, which is why neither the attitude
    # sigmoid nor the PBC ratio carries a sensitivity multiplier.

    # Experience beyond which a peer's remembered yield difference is not
    # counted as better evidence, in years. Two reasons to stop, not one: the
    # yield effect of conservation agriculture saturates, rising from +5.7% at
    # 5 years to +8.6% at 10 and still gaining slightly by 15, so past that a
    # longer record adds no signal; and a long record also spans more climate,
    # land-use and management history than a short one, so the extra years
    # bring confounding rather than precision. Deliberately one value for all
    # farmer types: it describes how long the practice takes to show itself,
    # which is agronomy and not time preference, and keeping it uniform also
    # lets every farmer in a country share one cached peer scan. Separate from
    # projection_horizon, which is how far a farmer projects its own benefits.
    max_experience_years: 15

    # Whether a peer's remembered effect is weighted by how well its land
    # stands in for the farm reading it (anticipated_change_between).
    #
    # Unweighted, the estimator differences each peer within itself, which
    # removes that peer's site from its own record, and then pools across the
    # neighbourhood or country with nothing asking whether those sites resemble
    # the receiving one. The consequence is measurable in the runs: a farm whose
    # soil already mineralises plenty of nitrogen, where a legume's fixation is
    # worth least, reads the same fractional gain as a farm where it is worth
    # most, and unaided legume adopters end up 0.22 SD below the cropland mean
    # on the legume-minus-catch-crop grain difference - the wrong land for the
    # crop they chose.
    land_similarity:
        # On, it reaches every comparison the estimator serves: anticipated
        # revenue and the anticipated carbon and nitrogen transfers as well as
        # the cover-crop type. Not narrowed to the cover crop, because the
        # objection is to the estimator and not to any one practice - if a
        # fractional gain is not conditioned on the receiving land in one
        # comparison, it is not conditioned on it in any of them.
        #
        # So runs made with this on are not comparable with runs made without
        # it. false reproduces the earlier runs exactly and is the way back.
        enabled: true
        # Smallest weight a peer can be reduced to, as a fraction of an
        # identical peer's, and the strength of the whole correction: 0 lets a
        # distant peer be discarded outright, 1 makes the kernel inert.
        #
        # Above zero so a distant peer is downweighted rather than discarded,
        # which matters early in a run when the only farms with a record of
        # both practices may be nothing like the asking farm. At 0.3 a peer has
        # to be some 2.7 population spreads away in one covariate before it
        # counts half as much as an identical farm, so the weighting bites on
        # land that genuinely differs and leaves ordinary comparisons alone.
        #
        # The only number here: distances are in units of the population's own
        # robust spread (world.compute_land_scales), so the kernel's width is
        # set by the dispersion of the land and needs no second parameter.
        floor: 0.3

    # How badly a farm reads its own fields.
    #
    # Off, farmers observe true model values, which is why the detection
    # threshold the paper reports is a lower bound: a signal that takes a
    # decade to show through clean observation takes longer through dirty
    # observation. On, it puts a number on that instead of conceding it.
    #
    # The error enters once, where the year's rates are taken in, and
    # everything a farm knows is built from there - its own performance score,
    # and the record its neighbours read, because a farm that misreads its
    # yield tells its neighbours the misreading rather than keeping a true set
    # of books for them. Schemes are not fooled: a carbon payment is billed off
    # the measured trend (CAFarmer.soilc_accumulation), so an observation error
    # slows adoption without becoming money.
    perception_noise:
        # false draws nothing at all, leaving the global random stream
        # undisturbed, so a run without noise is bit-identical to the model
        # before this existed.
        enabled: false
        # Width of the misreading, as a fraction of how much that metric
        # already moves year to year on that farm. A fraction and not a
        # physical figure, because a figure in gC/m2 would have to be set again
        # per metric, per region and per scenario, and would quietly mean
        # something different in each; the farm's own interannual spread is the
        # natural ruler and the model already tracks it. 0.25 means a typical
        # misreading a quarter the size of the year-to-year weather swing the
        # farm is already trying to see through.
        sigma: 0.25
        # Systematic misreading, in the same units, applied every year in the
        # same direction. Separate from sigma because optimism is not noise: it
        # does not average out over a long record, so a farm never reads
        # through it however long it watches. Negative is a farm that
        # consistently underrates what its land is doing.
        bias: 0.0
        # Per-metric multiplier on sigma: how much harder this metric is to
        # read than yield, which is the reference at 1.0.
        #
        # Needed because one sigma for all five says each is equally hard to
        # read against its own year-to-year movement, and the model's own
        # output says otherwise. In the conventional run the interannual spread
        # of the log rate is 0.108 for yield but 0.011 for agricultural soil
        # carbon, a stock integrating the weather a flux is exposed to. A flat
        # sigma of 0.25 therefore asks a farm to read its yield to about 3%,
        # which is about what a combine yield monitor manages, and its soil
        # carbon to 0.3%, which is past laboratory repeatability.
        #
        # These are evidence about what can be seen, not parameters to tune,
        # so sigma stays the one swept number and the sweep stays
        # one-dimensional. Set every entry to 1.0 to recover the flat sweep.
        observability:
            # Reference. A combine yield monitor resolves 3-9% differences;
            # Marchant et al. 2019 (Field Crops Res.) report standard errors
            # of 0.03-0.32 t/ha on UK cereal experiments, about 1-4% of yield,
            # against a modelled interannual spread of 0.108.
            yield: 1.0
            # A farm's accounts are the best-known number it has.
            profit: 0.5
            # Judged by feel and workability rather than measured.
            moisture: 1.5
            # Barely observable as a change. Stakeholders' perception of SOC
            # loss matched the measured indicator in 43% of French
            # departments, near chance, and farmer fertility ratings separate
            # low-carbon soils from the rest but not medium from high. The
            # large multiplier is mostly the small denominator: soil carbon's
            # modelled interannual spread is 0.011, so 1.0 here would claim a
            # farm reads its carbon to 0.3%.
            soilc: 20.0
            # Nitrate below the root zone is not visible at all without
            # sampling, which almost no farm does.
            leaching: 20.0

    # What a farm tells its neighbours, as against what its fields did.
    #
    # On top of perception_noise and separate from it, because the evidence
    # separates them. Instrumented comparison on a farm's own fields resolves
    # yield differences of a few percent; what farmers *report* is far worse.
    # Self-reported maize yields in Uganda ran at more than twice the crop-cut
    # and full-plot measures and correlated with full-plot harvest at r = 0.04
    # over all plots and 0.28 above 0.05 ha, with rounding and heaping on round
    # numbers among the named mechanisms (Lobell et al. 2020 AJAE; Gourlay,
    # Kilic & Lobell 2019 J. Dev. Econ.). Much of that gap is plot-area and
    # unit error that cancels in a self-referenced deviation, which is why the
    # default below is far smaller than those figures taken at face value.
    #
    # Applied to the within-peer difference, which is the only part a listener
    # receives: _collect_effects differences each peer against itself, so a
    # farm that overstates everything it does by one margin is already
    # corrected for. What survives is a farm describing one practice
    # differently from the other.
    reporting_noise:
        enabled: false
        # On the same ruler as perception_noise.sigma, so the two can be read
        # against each other: 1.0 says what a farm passes on is four times as
        # far off as what it sees itself at the 0.25 default above, which is
        # the rough ratio between instrumented comparison and self-reporting.
        sigma: 1.0
        # How much a farm talks up the practice it currently runs relative to
        # the one it does not. The self-justification term, and the part of a
        # reporting bias that does not cancel in the within-peer difference: a
        # farm that overstates everything equally is already handled.
        bias: 0.0
        # Same meaning and same evidence as under perception_noise: a metric a
        # farm cannot read is also one it cannot pass on.
        observability:
            yield: 1.0
            profit: 0.5
            moisture: 1.5
            soilc: 20.0
            leaching: 20.0

    # Spreading level toggles for social learning
    # Allows enabling/disabling each level of spreading for testing or single-country runs
    # When a level is disabled, its weight is redistributed to enabled levels
    enable_local: true       # Neighbour-based spreading (attitude + social norm)
    enable_country: true     # Country-level spreading (attitude + social norm)
    enable_cluster: false    # Agroecological cluster spreading (set false for single-country runs)
    # if enablele_country: cross-border social learning: blend own country stats with neighbouring countries
    # Weight for neighbouring countries' influence (0.0 = no cross-border, 0.5 = equal)
    # Own country weight = 1.0 - neighbour_country_weight
    neighbour_country_weight: 0  # 25% neighbours, 75% own country

# Pioneer share for the simulation
pioneer_share: 0.25

# Analogous to LPJmL pftpar, define the AFT parameters for the two different
#   farmer types
aftpar:
    # AFT for conservative/traditional values following farmer tending to stay
    #   with conventional agriculture
    traditionalist:
        pbc_base: 0.65  # base perceived behavioral control (captures risk aversion)

        weight_norm: 0.4  # Rogers "Late Majority": strong reliance on social proof
        weight_attitude: 0.6

        # weights attitude general
        weight_social_learning: 0.4
        weight_own_land: 0.6

        # Local, country, cluster weights for social components
        # Local effects (neighbours) typically dominate over country-level influence
        # because neighbours share similar ecological/cultural conditions
        weight_social_norm_local: 0.7      # Traditionalists rely more on local community
        weight_social_norm_country: 0.2    # Less influenced by distant farmers
        weight_social_norm_cluster: 0.1    # Minimal cross-border influence
        weight_attitude_local: 0.7         # Local social learning dominates
        weight_attitude_country: 0.2       # Country-level less influential
        weight_attitude_cluster: 0.1       # Minimal cross-border learning

        # Outcome importance weights (MUST sum to 1.0)
        # Either weight_yield OR weight_profit is used based on use_profit flag
        # Traditionalists focus on economic output, less on ecosystem services
        weight_yield: 0.65       # Used when use_profit=false
        weight_profit: 0.65 # Used when use_profit=true (% improvement)
        weight_soil: 0.1         # Soil carbon (ecosystem service)
        weight_moisture: 0.25    # Water resilience (ecosystem service)
        weight_leaching: 0.0     # Water quality (ecosystem service)

        # Trend weights per metric: how much to weight trend vs level (0-1)
        # level_weight = 1 - trend_weight
        # Based on metric dynamics: yield/moisture need maintenance (level);
        # soil carbon has legacy effects (trend matters more)
        trend_weight_yield: 0.3        # Level-dominant - absolute yields matter for income
        trend_weight_soil: 0.3         # Trend-dominant - soil health is about trajectory
        trend_weight_moisture: 0.3     # Very level-based - "do I have water now?"
        trend_weight_profit: 0.3  # Level-dominant - current profitability pays bills
        trend_weight_leaching: 0.3     # Balanced - current pollution & improvement trajectory

        # Similarity weights for social learning
        weight_bundle_similarity: 0.6   # Weight for practice bundle similarity
        weight_crop_similarity: 0.4     # Weight for crop portfolio similarity

        # Social norm thresholds (Granovetter 1978 heterogeneous thresholds).
        # Adoption fraction at which the practice feels "normative" (neutral).
        # Below threshold -> social drag; above -> social boost.
        # Traditionalists require broad uptake before a practice feels normal.
        threshold_social_norm_local: 0.2    # 20% of neighbours = neutral
        threshold_social_norm_country: 0.3  # 30% of country = neutral
        threshold_social_norm_cluster: 0.25  # 25% of climate-similar countries = neutral

        # Time parameters (AFT-specific)
        # How often a farmer reconsiders, how far ahead they look, and how
        # heavily they discount are three different things and are kept apart.
        # min_observation_years is the re-evaluation cadence only: the counter is
        # randomised around it both to require enough observations for an
        # informed decision and to desynchronise farmers.
        min_observation_years: 5    # Mean years between practice re-evaluations

        # How far ahead a farmer projects when judging an investment. Longer than
        # the re-evaluation cadence because the payoff of a soil practice arrives
        # over a decade: the measured yield gain of full conservation agriculture
        # is negligible at 3 years, +5.7% at 5 and +8.6% at 10, so a 5-year view
        # sees about half of it.
        projection_horizon: 10      # Years of future benefit considered

        # Annual discount rate over that horizon, benefits counted as an annuity
        # (1 - (1+r)^-H) / r, so H=10 at r=0.1 is worth 6.14 years of benefit.
        # Experimental estimates for credit-constrained smallholders commonly run
        # at 15% and above, and high discounting is itself a standard explanation
        # for under-adoption of conservation practices, so this is a conservative
        # middle value.
        discount_rate: 0.10

        confidence_years: 15        # Years to reach full confidence (linear ramp)
        memory_decay_years: 30      # When old memories are forgotten
        fallback_years: 10          # Consecutive decline years to trigger revert

        # Exploration parameters (Rogers 2003)
        exploration_base_prob: 0.15 # Base probability of random exploration
        poor_performance_multiplier: 2.0 # Multiplier when current_score < baseline_score
        max_exploration_prob: 0.3  # Cap on exploration probability

        # Cover crop type: legume or catch crop. Held on its own terms, because
        # the two crops differ by one to two per cent of yield against a seed
        # premium of much the same size, so the choice is decided on peer
        # records and those records need long, clean episodes to say anything.
        #
        # The commitment matches confidence_years, the span over which this
        # farmer comes to trust an observation: a crop it would not keep that
        # long is one it can never form a view on.
        cover_crop_type_commitment_years: 15
        # Over two options, not eight, so well below exploration_base_prob.
        # Enough to keep a record of the other crop alive without leaving a
        # standing fraction of farms on the one they judged worse.
        cover_crop_type_exploration_prob: 0.05

    # AFT for pioneer farmer who more likely tends to transition to new (promising)
    #   regenerative agriculture practices
    pioneer:
        pbc_base: 0.85  # base perceived behavioral control (captures risk aversion)
        weight_attitude: 0.8
        weight_norm: 0.2  # Rogers "Innovators/Early Adopters": low but non-zero

        # weights attitude general
        weight_social_learning: 0.6
        weight_own_land: 0.4

        # Local, country, cluster weights for social components
        # Pioneers are more open to learning from distant farmers (early adopters)
        # and less bound by local community norms (Rogers 2003)
        weight_social_norm_local: 0.5      # Still important but less dominant
        weight_social_norm_country: 0.3    # More open to country-level trends
        weight_social_norm_cluster: 0.2    # Open to cross-border influence
        weight_attitude_local: 0.5         # Local social learning still relevant
        weight_attitude_country: 0.3       # More willing to learn from afar
        weight_attitude_cluster: 0.2       # Open to cross-border learning

        # Outcome importance weights (MUST sum to 1.0)
        # Either weight_yield OR weight_profit is used based on use_profit flag
        # Pioneers are more balanced, value ecosystem services more
        weight_yield: 0.5        # Used when use_profit=false
        weight_profit: 0.5  # Used when use_profit=true (% improvement)
        weight_soil: 0.25        # Soil carbon (ecosystem service)
        weight_moisture: 0.25    # Water resilience (ecosystem service)
        weight_leaching: 0.0     # Water quality (ecosystem service)

        # Trend weights per metric: how much to weight trend vs level (0-1)
        # Pioneers weight soil trends even more (long-term thinking)
        trend_weight_yield: 0.3        # Level-dominant - absolute yields matter for income
        trend_weight_soil: 0.7         # Trend-dominant - soil health is about trajectory
        trend_weight_moisture: 0.2     # Very level-based - "do I have water now?"
        trend_weight_profit: 0.4  # Level-dominant - current profitability pays bills
        trend_weight_leaching: 0.5     # Balanced - current pollution & improvement trajectory

        # Similarity weights for social learning
        weight_bundle_similarity: 0.5   # Weight for practice bundle similarity
        weight_crop_similarity: 0.5     # Weight for crop portfolio similarity

        # Social norm thresholds (Granovetter 1978 heterogeneous thresholds).
        # Pioneers feel "normed" at much lower adoption fractions than
        # traditionalists - they interpret early signals as sufficient.
        threshold_social_norm_local: 0.1    # 10% of neighbours = neutral
        threshold_social_norm_country: 0.15  # 15% of country = neutral
        threshold_social_norm_cluster: 0.12  # 12% of climate-similar countries = neutral

        # Time parameters (AFT-specific). See the traditionalist block for what
        # each one governs and why the cadence and the horizon are separate.
        min_observation_years: 3    # Pioneers re-evaluate more frequently
        projection_horizon: 8       # Slightly shorter view than traditionalists
        discount_rate: 0.10         # Same rate; the horizon carries the difference
        confidence_years: 10         # Pioneers trust observations sooner
        memory_decay_years: 25      # Pioneers forget old experiences faster
        fallback_years: 8           # Pioneers revert sooner if things go badly

        # Exploration parameters (Rogers 2003)
        exploration_base_prob: 0.3 # Pioneers explore much more
        poor_performance_multiplier: 2.0 # Multiplier when current_score < baseline_score
        max_exploration_prob: 0.6  # Higher cap for pioneers

        # Cover crop type: see the traditionalist block. Both follow the same
        # rule - the commitment tracks confidence_years, which is shorter here,
        # and the draw stays well under exploration_base_prob.
        cover_crop_type_commitment_years: 10
        cover_crop_type_exploration_prob: 0.10