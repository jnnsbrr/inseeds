model: "InSEEDS"

# Control run settings
control_run: False
# Enable PyInstrument profiling for the driver (main) process
# Generates HTML profile at: {output_dir}/profiling_{timestamp}.html
profiling: false

# Parallelization settings for country updates
# Designed for Python 3.14+ free-threaded mode (no GIL)
parallelization:
    # Mode: 'serial' or 'threaded'
    # 'serial' = sequential execution (default, safe)
    # 'threaded' = use ThreadPoolExecutor for parallel country updates
    mode: 'serial'
    # Maximum number of worker threads (0 = auto-detect from CPU count)
    max_workers: 0
    # Enable debug output for parallelization
    debug: false


# Output collection settings for pycopanlpjml
# All settings from pycopanlpjml/config.yaml are explicitly listed here
output:
    # Output formats to write (after simulation completes)
    # If empty list [], no outputs will be written
    # Options: "netcdf", "parquet", "csv"
    # - NetCDF: Recommended for scientific analysis (fastest, CF-compliant)
    # - Parquet: Good for data analysis (columnar, compressed)
    # - CSV: Human-readable, good for small runs (slowest)
    format: ["netcdf", "csv"]  # or ["csv"], ["parquet"], ["netcdf"], []

    # Variables to be written to output files
    # This defines which entity-level variables should be collected and written
    # Format: {entity_type}: [list of variable names]
    # Variables must be defined in the entity's output_variables class attribute
    # Entity types: world, country, cell, farmer (or individual)
    # Entity type names are derived from class names (lowercased):
    # - World -> "world"
    # - Country -> "country"
    # - Cell -> "cell"
    # - Farmer -> "farmer" (also accepts "individual" as alias)
    # Country-level variables (static, written once)
    country:
        - "agroecological_cluster"  # Cluster ID based on climate similarity

    # Farmer-level variables (Farmer class uses 'farmer' as entity type)
    # Use dotted paths for nested objects (e.g., behaviour.tpb)
    farmer:
        - "aft_id"
        - "tillage"
        - "cover_crop"
        - "residue_on_field"
        - "behaviour.practice_bundle_id"   # Current bundle ID (0-7), settable for Dask sync
        - "behaviour.proposed_bundle_id"   # Bundle being evaluated (-1 if none)
        - "behaviour.tpb"               # TPB value FOR the proposed_bundle_id
        - "behaviour.attitude"          # Attitude FOR the proposed_bundle_id
        - "behaviour.social_norm"       # Social norm FOR the proposed_bundle_id
        - "behaviour.pbc"               # PBC FOR the proposed_bundle_id
        - "behaviour.transition_blocker"    # Primary reason for blocked transition (0-12), label in 'label' column
        - "behaviour.transition_driver"     # Primary reason for successful transition (0-9), label in 'label' column
        - "capital"                     # Farm capital stock (USD, scaled by farm size)
        - "farm_size"                   # Farm size in hectares
        - "soilc"
        - "cropyield"
        - "root_moisture"
        - "litter_cover"

# Define which farmer variables map with coupled LPJmL input variables
coupling_map:
    tillage: ["with_tillage"]
    cover_crop: ["cover_crop"]
    residue_on_field: ["residue_on_field"]

# Practice dimensions for multi-practice farmer decisions
practice_dimensions:
    tillage: { n_options: 2 }  # 0=no-till (CA), 1=conventional tillage
    cover_crop:
        n_options: 3  # 0=none, 1=non-legumes, 2=legumes
        leaching_high: 5    # mgN/l threshold for non-legume selection
        fertilizer_high: 10  # gN/m2/yr threshold for non-legume selection
    residue:
        # FAO CA threshold: 30% soil cover from crop residues
        # Below this, farmer increases retention; at/above, maintains current level
        ca_cover_threshold: 0.3

# Exploration constraints for random bundle exploration
# Prevents farmers from repeatedly trying unreasonable or failed combinations
exploration:
    # Number of failures (fallbacks) before excluding bundle from exploration
    # Farmers learn from their mistakes and avoid bundles that have failed twice
    max_failures: 2

# Residue economics using Smerald et al. (2023) MADRaT data
# "A global dataset for the production and usage of cereal residues"
# Data: production = recycled + removed + burnt
#   - burnt: burned (no economic value)
#   - removed: animal feed + other purposes (has opportunity cost)
#   - recycled: bedding returns to field with manure (no net cost)
#
# OPPORTUNITY COST AS PERCENTAGE OF CROP VALUE:
# ---------------------------------------------
# Singh & Schiere (1995, Ch. 1.1, Box 1) found: "the value of the straw yield
# can represent between 10-15% or higher of the total crop value"
#
# We implement this dynamically: residue_cost = crop_revenue × fraction
# This makes costs spatially and temporally variable (higher yields → higher cost)
#
# Cross-validation with market prices:
#   - Germany: €57-61/t (Karras et al. 2024) → 4 t/ha × €60/t = €240/ha
#   - India: $30-35/t (Duncan et al. 2020) → 4 t/ha × $33/t = $132/ha
#   - 12.5% of $600/ha crop value = $75/ha (reasonable global average)
#
# References:
#   - Singh, K. & Schiere, J.B. (eds.) (1995). Handbook for Straw Feeding
#     Systems. ICAR, New Delhi / Wageningen Agricultural University.
#     https://edepot.wur.nl/333326
#   - Karras, T., Noack, V. & Thrän, D. (2024). The Costs of Straw in Germany.
#     Waste and Biomass Valorization 15: 5369-5385.
#   - Duncan, A.J., Samaddar, A. & Blümmel, M. (2020). Rice and wheat straw
#     fodder trading in India. Field Crops Research 246: 107680.
#
residue_economics:
    # Opportunity cost as fraction of crop revenue (Singh & Schiere 1995: 10-15%)
    # Weighted by spatial fractions from MADRaT data (Smerald et al. 2023)
    use_cost_fractions:
        burnt: 0.0            # Burned - no economic value
        removed: 0.125        # 12.5% of crop value (midpoint of 10-15%)
        recycled: 0.0         # Returns to field via manure - no cost

# Agroecological country clustering for tele-coupled social learning
# Countries with similar agroecological conditions share social learning signals
agroecological_clustering:
    # Number of clusters. null = auto-determine via elbow method
    n_clusters: null
    # Range to search for optimal k when n_clusters is null
    k_range: [5, 15]

# Farm economics (USD per hectare)
# Note: Values are per hectare to match LPJmL spatial resolution
# Average farm sizes vary: USA ~180 ha, EU median ~5 ha (Our World in Data, 2020)
#
# FAO BASELINE + DEVIATIONS CAPITAL DYNAMICS MODEL
# -------------------------------------------------
# FAO provides the baseline capital dynamics. We track DEVIATIONS:
#
#   K_{t+1} = K × (1 + i - δ) + Δrevenue - Δcosts
#
# where:
#   - i - δ = FAO net rate (investment - depreciation, typically +2-7%/year)
#   - Δrevenue = current_revenue - baseline_revenue
#   - Δcosts = cost difference between current and baseline bundle
#
# BASELINES (set at initialization):
#   - baseline_revenue: Average over historic period (2015-2025 LPJmL data)
#   - baseline_bundle: Initial practice bundle at simulation start
#
# KEY BEHAVIORS:
#   - If Δrevenue = 0 and Δcosts = 0: farmer follows FAO baseline exactly
#   - Better yields (Δrevenue > 0): capital grows faster than baseline
#   - Worse yields (Δrevenue < 0): capital grows slower than baseline
#   - CA with higher costs: Δcosts > 0 → reduces capital vs baseline
#   - CA with savings (no-till): Δcosts < 0 → increases capital vs baseline
#
# WHY THIS WORKS:
#   FAO (i - δ) already captures everything at sector average: depreciation,
#   reinvestment, subsidies, loans, typical yields/costs. We don't model
#   these explicitly - just the deviations from this baseline.
#
# References:
#   - Solow (1956). Capital accumulation framework
#   - OECD (2009). Measuring Capital Manual
#   - FAO (2023). FAOSTAT Capital Stock
#   - Farm Financial Scorecard (CFFM, University of Minnesota)
#   - Davis, J. (2022). "Farm's Target for Working Capital." SDSU Extension.
#
farm_economics:
    # Minimum capital buffer as fraction of initial capital.
    # Below this threshold, farmers are forced to deselect practices.
    # Based on Farm Financial Scorecard: working capital/gross revenue
    #   - Strong: > 0.35 (can weather 1-2 year downturn)
    #   - Vulnerable: < 0.20 (trouble repaying loans)
    # Using 0.25 as midpoint between vulnerable and strong thresholds.
    # Note: FAO NCS excludes land (SNA 2008 definition), so this fraction
    # applies to productive capital (machinery, equipment, buildings).
    min_capital_fraction: 0.25
    # The FAO rates (i - δ) capture the NET capital change at sector level,
    # including: depreciation, reinvestment, subsidies, loans, average costs.
    # This is our baseline - what happens to capital at sector average.
    fao_capital_baseline: false

# Practice costs (USD per hectare)
# Costs are scaled by farmer's capital intensity relative to reference (US).
# Each cost has [min, max] range; actual cost = interpolated by capital ratio.
#   cost = min + (max - min) × clamp(capital_per_ha / reference_capital, 0, 1)
#
# Cost components are additive - code sums all entries in 'costs' dict.
# For cover_crop/residue_on_field: positive = annual cost when practice is active.
# For tillage: costs are defined for conventional tillage (tillage=1); negated for
# no-till (tillage=0). Herbicide can be negative (lower chemical use with tillage).
# New components can be added without code changes.
#
# Note: When capital is low, practices are deselected in order of direct cost
#       (highest first): cover_crop > residue > tillage
#
# References:
#   [1] University of Illinois farmdoc (2023). Machinery Cost Estimates: Field Operations.
#       https://farmdoc.illinois.edu/assets/management/machinery-costs/field_operations_2023.pdf
#   [2] USDA CEAP (2022). Save Money on Fuel with No-Till Farming.
#       https://www.farmers.gov/blog/save-money-on-fuel-with-no-till-farming
#   [3] No-Till Farmer (2022). Fuel Savings Analysis. $17/acre = $42/ha.
#       https://www.no-tillfarmer.com/articles/12068-usda-save-17-per-acre-on-fuel-by-switching-to-no-till
#   [4] SARE (2019). Cover Crop Economics. https://www.sare.org/wp-content/uploads/Cover-Crop-Economics.pdf
#   [5] Indigo Ag / Iowa State (2020). Cover Crop Equipment & Custom Rates.
#       https://app.indigoag.com/programs/learn/paper/what-equipment-is-needed-to-plant-cover-crops
#   [6] CMV360 (2026). Zero Tillage in India: Prices, Subsidies, ROI.
#       Custom hire rates: ₹500-900/acre = $15-27/ha.
#       https://www.cmv360.com/tractors/articles/zero-tillage-in-india-2026
#   [7] Hossain et al. (2017). Cost effective small No-till seeder for Bangladesh.
#       Bangladesh J. Agril. Res. 42(1): 27-34. Small seeder cost: $350-400.
#       https://doi.org/10.3329/bjar.v42i1.31970
#   [8] Modern Ag Alliance (2025). Crop Protection and Farm Bill Programs.
#       Labor: $7.54-14.65/acre = $19-36/ha additional for conventional tillage.
#   [9] SD State Extension (2026). Economic Advantages of No-Till: Diesel Fuel.
#       Equipment: $15-30/acre = $37-74/ha higher for conventional tillage.
#       Repair costs 30-50% higher in multi-pass tillage systems.
#   [10] Soil Health Partnership / EDF (2021). Conservation tillage reduces operating costs.
#        Burndown herbicide: +$9.33/acre = $23/ha for no-till.
#   [11] Bowman et al. (2024). Herbicide use for conservation tillage adoption.
#        PLOS One 19(11), e0311960. Herbicide: +$6/acre = $15/ha baseline.
#
practice_costs:
    # Reference country for cost scaling - costs are scaled relative to this country's
    # capital per ha from FAO data. USA used because literature values originate there.
    reference_capital_country: "USA"

    tillage:
        # ONE-TIME TRANSITION COST (equipment)
        # US literature value: $66/ha (no-till planter amortized) [1]
        # India custom hire: ₹500-900/acre = $15-27/ha [6]
        # Bangladesh small seeder: $350-400 total ≈ $7-10/ha amortized [7]
        # SYMMETRIC: Applied in BOTH directions (equipment needed either way)
        transition: [40.0, 66.0]   # $/ha [1,6,7]

        # ANNUAL OPERATING COSTS (conventional tillage relative to no-till)
        # Defined for TILLAGE (tillage=1): positive = higher cost vs no-till baseline.
        # No-till (tillage=0) is the REFERENCE POINT with cost = 0.
        # Switching from conventional to no-till SAVES money (negative cost diff).
        # Switching from no-till to conventional COSTS more (positive cost diff).
        # Range: [low-capital, high-capital]
        costs:
            # Higher fuel use from extra field passes (4-6 conv vs 1-2 no-till)
            # USA: 4 gal/acre extra × $4-5/gal = $16-20/acre = $40-50/ha [2,3]
            # Low-capital: less mechanization, smaller tractors, less baseline fuel
            fuel: [15.0, 45.0]         # $/ha/yr [2,3]

            # Higher labor from extra field operations
            # USA: 4-6 extra passes × ~$3-6/acre/pass = $12-36/acre = $30-90/ha
            # Conservative estimate: $19-36/ha [8]
            labor: [5.0, 25.0]         # $/ha/yr [8]

            # Higher equipment/repair costs from machinery wear
            # USA: 30-50% higher repair costs for conventional = $15-30/acre [9]
            equipment: [8.0, 30.0]    # $/ha/yr [9]

            # Lower herbicide use (mechanical weed control replaces chemicals)
            # USA: burndown avoided +$9/acre = $23/ha [10]; net +$6-20/acre [11]
            # Negative = cost reduction vs no-till (herbicide savings with tillage)
            herbicide: [-35.0, -8.0]   # $/ha/yr [10,11]

        # NET ANNUAL COST when tillage=1 (sum of components):
        #   Low-capital:  15 + 5 + 8  - 8  =  20 $/ha/yr vs no-till
        #   High-capital: 45 + 25 + 30 - 35 =  65 $/ha/yr vs no-till
        # When tillage=0 (no-till): cost = 0 (reference point)
        # Cost DIFFERENCE (conv→no-till) = 0 - 65 = -65 $/ha/yr (savings)

    cover_crop:
        # ONE-TIME TRANSITION COST (seeder equipment)
        # US literature value: $20/ha transition (seeder attachment) [4,5]
        # Low-capital: simple broadcasting vs precision drilling
        # ASYMMETRIC: Only applied when ADOPTING (0→1), not abandoning (1→0)
        # Abandoning cover crops = just stop planting, no new equipment needed
        transition: [12.0, 22.0]   # $/ha [4,5]

        # ANNUAL OPERATING COSTS
        # All positive (cover crops are an additional investment)
        costs:
            # Seed purchase costs
            # USA: $20-40/acre = $50-100/ha depending on species mix [4]
            # Low-capital: can be similar due to imports; use simpler mixes
            seeds: [28.0, 40.0]        # $/ha/yr [4]

            # Seeding/planting labor and fuel
            # USA: $10-15/acre = $25-37/ha for drilling [4]
            # Low-capital: cheaper labor, often broadcasting vs drilling
            labor: [15.0, 20.0]        # $/ha/yr [4]

            # Termination costs (rolling/crimping or burndown herbicide)
            # USA: $5-15/acre = $12-37/ha [4]
            # Low-capital: often mechanical termination, cheaper herbicide
            termination: [12.0, 15.0]  # $/ha/yr [4]

        # NET ANNUAL COST (sum of components):
        #   Low-capital:  28 + 15 + 12 = 55 $/ha/yr
        #   High-capital: 40 + 20 + 15 = 75 $/ha/yr

    residue_on_field:
        # Modern combines have straw choppers/spreaders as standard equipment.
        # No additional equipment needed for retention vs removal.
        # Purdue Extension CT-5: spreaders/choppers are standard attachments.
        transition: 0.0    # $/ha - no special equipment needed

        # Opportunity cost is computed DYNAMICALLY in get_bundle_direct_costs()
        # using compute_residue_opportunity_cost() which calculates:
        #   crop_revenue × use_cost_fractions (from residue_economics section)
        # Based on Singh & Schiere (1995): straw value = 10-15% of crop value.
        # This makes residue costs spatially and temporally variable with yields.
        costs: {}          # Empty - costs computed dynamically

# TPB specifc settings and parameters
tpb:
    transition_threshold: 0.5   # TPB threshold for any practice change

    # ATTITUDE SENSITIVITY
    # --------------------
    # Single calibration parameter for the scoring system.
    # Scales score differences before the attitude sigmoid.
    #
    # Both levels and trends are normalized to country references:
    #   - Level: ratio to country mean (1.0 = average)
    #   - Trend: ratio to country std of trends (z-score style)
    #
    # Score differences are typically small (±0.2-0.5), so this sensitivity
    # amplifies them to produce meaningful attitude shifts via sigmoid.
    # Higher values → more responsive to performance differences
    # Lower values → more conservative, requires larger gaps to shift
    #
    attitude_sensitivity: 1

    # Spreading level toggles for social learning
    # Allows enabling/disabling each level of spreading for testing or single-country runs
    # When a level is disabled, its weight is redistributed to enabled levels
    enable_local: true       # Neighbour-based spreading (attitude + social norm)
    enable_country: true     # Country-level spreading (attitude + social norm)
    enable_cluster: true    # Agroecological cluster spreading (set false for single-country runs)
    # if enablele_country: cross-border social learning: blend own country stats with neighbouring countries
    # Weight for neighbouring countries' influence (0.0 = no cross-border, 0.5 = equal)
    # Own country weight = 1.0 - neighbour_country_weight
    neighbour_country_weight: 0  # 25% neighbours, 75% own country

# Pioneer share for the simulation
pioneer_share: 0.25

# Analogous to LPJmL pftpar, define the AFT parameters for the two different
#   farmer types
aftpar:
    # AFT for conservative/traditional values following farmer tending to stay
    #   with conventional agriculture
    traditionalist:
        pbc_base: 0.75  # base perceived behavioral control (captures risk aversion)
        weight_norm: 0.4  # Rogers "Late Majority": strong reliance on social proof
        weight_attitude: 0.6

        # weights attitude general
        weight_social_learning: 0.4
        weight_own_land: 0.6

        # Local, country, cluster weights for social components
        # Local effects (neighbours) typically dominate over country-level influence
        # because neighbours share similar ecological/cultural conditions
        weight_social_norm_local: 0.7      # Traditionalists rely more on local community
        weight_social_norm_country: 0.2    # Less influenced by distant farmers
        weight_social_norm_cluster: 0.1    # Minimal cross-border influence
        weight_attitude_local: 0.7         # Local social learning dominates
        weight_attitude_country: 0.2       # Country-level less influential
        weight_attitude_cluster: 0.1       # Minimal cross-border learning

        # weight variables for yield, soil, moisture (outcome importance)
        weight_yield: 0.65 # Yield is everything
        weight_soil: 0.1 # "I'll worry about that later"
        weight_moisture: 0.25  # Drought scares me

        # Trend weights per metric: how much to weight trend vs level (0-1)
        # level_weight = 1 - trend_weight
        # Based on metric dynamics: yield/moisture need maintenance (level);
        # soil carbon has legacy effects (trend matters more)
        trend_weight_yield: 0.2     # Level-dominant (good yields should be maintained)
        trend_weight_soil: 0.7      # Trend-dominant (legacy effects, trajectory matters)
        trend_weight_moisture: 0.3  # Mostly level-based

        # Similarity weights for social learning
        weight_bundle_similarity: 0.6   # Weight for practice bundle similarity
        weight_crop_similarity: 0.4     # Weight for crop portfolio similarity

        # Social norm thresholds (Granovetter 1978 heterogeneous thresholds).
        # Adoption fraction at which the practice feels "normative" (neutral).
        # Below threshold -> social drag; above -> social boost.
        # Traditionalists require broad uptake before a practice feels normal.
        threshold_social_norm_local: 0.20    # 20% of neighbours = neutral
        threshold_social_norm_country: 0.30  # 30% of country = neutral
        threshold_social_norm_cluster: 0.25  # 25% of climate-similar countries = neutral

        # Time parameters (unified, AFT-specific)
        # min_observation_years serves dual purpose:
        # 1. Data quality: need enough observations for informed decisions
        # 2. Evaluation timing: counter is randomized around this value to desynchronize farmers
        min_observation_years: 5    # Mean years between practice re-evaluations
        confidence_years: 10        # Years to reach full confidence (linear ramp)
        memory_decay_years: 30      # When old memories are forgotten
        fallback_years: 10          # Consecutive decline years to trigger revert

        # Exploration parameters (Rogers 2003)
        exploration_base_prob: 0.02 # Base probability of random exploration (doubled from 0.01)
        poor_performance_threshold: 0.01  # Weighted score below which exploration doubles
        poor_performance_multiplier: 2.0 # Multiplier for poor performers
        max_exploration_prob: 0.15  # Cap on exploration probability

    # AFT for pioneer farmer who more likely tends to transition to new (promising)
    #   regenerative agriculture practices
    pioneer:
        pbc_base: 0.95  # base perceived behavioral control (captures risk aversion)
        weight_attitude: 0.8
        weight_norm: 0.2  # Rogers "Innovators/Early Adopters": low but non-zero

        # weights attitude general
        weight_social_learning: 0.6
        weight_own_land: 0.4

        # Local, country, cluster weights for social components
        # Pioneers are more open to learning from distant farmers (early adopters)
        # and less bound by local community norms (Rogers 2003)
        weight_social_norm_local: 0.5      # Still important but less dominant
        weight_social_norm_country: 0.3    # More open to country-level trends
        weight_social_norm_cluster: 0.2    # Open to cross-border influence
        weight_attitude_local: 0.5         # Local social learning still relevant
        weight_attitude_country: 0.3       # More willing to learn from afar
        weight_attitude_cluster: 0.2       # Open to cross-border learning

        # weight variables for yield, soil, moisture (outcome importance)
        weight_yield: 0.5 # Still need to make money
        weight_soil: 0.25 # More educated about long-term
        weight_moisture: 0.25  # Same drought concern

        # Trend weights per metric: how much to weight trend vs level (0-1)
        # Pioneers weight soil trends even more (long-term thinking)
        trend_weight_yield: 0.2     # Level-dominant (good yields should be maintained)
        trend_weight_soil: 0.8      # Very trend-focused (pioneers care about trajectory)
        trend_weight_moisture: 0.3  # Mostly level-based

        # Similarity weights for social learning
        weight_bundle_similarity: 0.5   # Weight for practice bundle similarity
        weight_crop_similarity: 0.5     # Weight for crop portfolio similarity

        # Social norm thresholds (Granovetter 1978 heterogeneous thresholds).
        # Pioneers feel "normed" at much lower adoption fractions than
        # traditionalists - they interpret early signals as sufficient.
        threshold_social_norm_local: 0.10    # 10% of neighbours = neutral
        threshold_social_norm_country: 0.15  # 15% of country = neutral
        threshold_social_norm_cluster: 0.12  # 12% of climate-similar countries = neutral

        # Time parameters (unified, AFT-specific)
        min_observation_years: 3    # Pioneers re-evaluate more frequently
        confidence_years: 8         # Pioneers trust observations sooner
        memory_decay_years: 25      # Pioneers forget old experiences faster
        fallback_years: 8           # Pioneers revert sooner if things go badly

        # Exploration parameters (Rogers 2003)
        exploration_base_prob: 0.12 # Pioneers explore much more (doubled+ from 0.05)
        poor_performance_threshold: 0.01  # Weighted score below which exploration doubles
        poor_performance_multiplier: 2.0 # Multiplier for poor performers
        max_exploration_prob: 0.25  # Higher cap for pioneers